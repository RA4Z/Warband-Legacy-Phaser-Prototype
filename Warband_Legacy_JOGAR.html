  <div id="game-shell">

  <script>"use strict";

// src/core/random.js
// PRNG simples reproduzível. Todo sorteio relevante passa pelo estado da expedição.
function rng(seed=1){let s=(seed>>>0)||1;return {next(){s^=s<<13;s^=s>>>17;s^=s<<5;return (s>>>0)/4294967296;},int(a,b){return a+Math.floor(this.next()*(b-a+1));},pick(a){return a[this.int(0,a.length-1)];},get state(){return s>>>0;},set state(v){s=v>>>0||1;}};}
function shuffle(array,r){const a=[...array];for(let i=a.length-1;i>0;i--){const j=r.int(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
const distance=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const clamp=(a,b,c)=>Math.max(b,Math.min(c,a));
const round=(a)=>Math.round(a*10)/10;


// src/game/data.js
const VERSION=2;
const CLASSES={
  swordsman:{name:'Espadachim',icon:'⚔',hp:100,attack:15,defense:10,range:1.65,cooldown:1.1,speed:6.55,role:'front',color:'#e0c4a2'},
  guardian:{name:'Guardião',icon:'⬡',hp:165,attack:9,defense:24,range:1.55,cooldown:1.4,speed:5.85,role:'front',color:'#9daec7'},
  spearman:{name:'Lanceiro',icon:'↟',hp:110,attack:14,defense:11,range:2.65,cooldown:1.3,speed:6.3,role:'front',color:'#dec18a'},
  archer:{name:'Arqueiro',icon:'➶',hp:72,attack:19,defense:4,range:10.5,cooldown:1.7,speed:6.75,role:'back',color:'#98cb8d'},
  mystic:{name:'Místico',icon:'✦',hp:68,attack:24,defense:3,range:9,cooldown:2.2,speed:6.3,role:'back',color:'#c3a8e8'},
  healer:{name:'Curandeiro',icon:'✚',hp:85,attack:5,defense:6,range:8.5,cooldown:2.6,speed:6.45,role:'back',color:'#f0e4ac'},
};
const TRAITS={sturdy:{name:'Resistente',desc:'+12% PV',hp:1.12},swift:{name:'Ágil',desc:'+10% velocidade',speed:1.1},precise:{name:'Preciso',desc:'+10% ataque',attack:1.1},careful:{name:'Prudente',desc:'-10 p.p. chance de morte',survive:0.1}};
const GRADES=['recruit','veteran','elite','legendary'];
const GRADE_NAME={recruit:'Recruta',veteran:'Veterano',elite:'Elite',legendary:'Lendário'};
const GRADE_MIN={veteran:3,elite:6,legendary:9};
const GRADE_COST={veteran:3,elite:7,legendary:13};
const ENEMIES={
  raider:{name:'Saqueador',hp:75,attack:11,defense:5,range:1.5,cooldown:1.45,speed:4.25,color:'#a94e4d',classId:'swordsman'},
  brute:{name:'Brutamontes',hp:135,attack:13,defense:16,range:1.65,cooldown:1.85,speed:3.55,color:'#ad6a53',classId:'guardian'},
  marksman:{name:'Atirador',hp:58,attack:12,defense:3,range:9.2,cooldown:2.05,speed:3.9,color:'#9c576c',classId:'archer'},
  shaman:{name:'Xamã',hp:72,attack:18,defense:3,range:8,cooldown:2.35,speed:3.55,color:'#9d6ea5',classId:'mystic'},
  warlord:{name:'Lorde da Cinza',hp:560,attack:24,defense:20,range:2.15,cooldown:1.6,speed:4.0,color:'#e17b55',classId:'guardian',boss:true}
};
const COMMANDERS={iron:{name:'Capitão de Ferro',subtitle:'Grito de guerra + Golpe heroico',color:'#dcb56e',a1:'Brado',a2:'Golpe'},valley:{name:'Estrategista do Vale',subtitle:'Proteção + Saraivada',color:'#74c7b9',a1:'Proteção',a2:'Saraivada'}};
const PERKS=[
 {id:'shield',name:'Escudos Reforçados',icon:'⬡',desc:'+15% defesa dos Guardiões'},
 {id:'arrows',name:'Treino de Arco',icon:'➶',desc:'+12% ataque dos Arqueiros'},
 {id:'march',name:'Marcha Rápida',icon:'↟',desc:'+8% velocidade de todos'},
 {id:'healing',name:'Medicina de Campanha',icon:'✚',desc:'+15% cura dos Curandeiros'},
 {id:'health',name:'Disciplina',icon:'♥',desc:'+10% vida máxima dos soldados'},
 {id:'charge',name:'Investida Coordenada',icon:'⚔',desc:'+10% dano de todos'},
 {id:'spears',name:'Lanças Longas',icon:'⌁',desc:'+15% alcance dos Lanceiros'},
 {id:'magic',name:'Rituais Arcanos',icon:'✦',desc:'+15% ataque dos Místicos'},
 {id:'fury',name:'Última Resistência',icon:'♨',desc:'+20% dano com menos de 40% PV'},
 {id:'loot',name:'Bolsas de Saque',icon:'◈',desc:'+20% moedas de vitória'},
 {id:'supplies',name:'Intendência',icon:'▣',desc:'+1 suprimento por baú'},
 {id:'xp',name:'Veterania Acelerada',icon:'★',desc:'+20% experiência dos soldados'}
];
const UPGRADE_DATA={
 infirmary:{name:'Enfermaria',icon:'✚',max:3,cost:[5,10,17],desc:l=>`Risco de morte: ${35-l*4}% (mais traços)`},
 quarters:{name:'Alojamentos',icon:'⌂',max:2,cost:[7,15],desc:l=>`Capacidade permanente: ${12+l*4}`},
 academy:{name:'Academia',icon:'★',max:3,cost:[5,9,15],desc:l=>`XP adicional: ${l*8}%`},
 command:{name:'Mesa de Comando',icon:'⚑',max:2,cost:[6,13],desc:l=>`Vida do comandante: +${l*8}%`}
};
const FIRST_NAMES=['Aldren','Brina','Cael','Dora','Eron','Fara','Garen','Helia','Ivar','Jora','Kael','Lyra','Merek','Nara','Orin','Petra','Roder','Selia','Tarin','Vera','Yoren','Zara','Borin','Elric','Mira','Talia','Oren','Freya'];
const LAST_NAMES=['Pedrafria','Valeverde','Ferroalto','de Arven','Carvalho','da Névoa','Corvoclaro','do Norte','Seta Ágil','do Prado','Luar','Mão Firme'];


// src/game/units.js


function generateSoldier(r,id,runId='fundacao'){
  const classId=r.pick(Object.keys(CLASSES));const traitId=r.pick(Object.keys(TRAITS));
  const soldier={id, name:`${r.pick(FIRST_NAMES)} ${r.pick(LAST_NAMES)}`,classId,traitId,level:1,xp:0,grade:'recruit',condition:'healthy',hp:0,appearanceSeed:r.int(1,999999),battles:0,kills:0,recruitmentRunId:runId,isPersistentVeteran:runId==='fundacao',recoveryRunsRemaining:0};
  soldier.hp=statsFor(soldier).hp;return soldier;
}
function statsFor(soldier,perks=[],academy=0){
  const base=CLASSES[soldier.classId];if(!base)return {hp:1,attack:1,defense:1,speed:1,range:1,cooldown:1};
  const gradeIndex=GRADES.indexOf(soldier.grade),trait=TRAITS[soldier.traitId]||{};
  const levelScale=1+(soldier.level-1)*0.075,gradeScale=1+gradeIndex*.095;
  const mult=id=>1+perks.filter(p=>p===id).length*(id==='health'?.10:id==='march'?.08:id==='shield'?.15:id==='arrows'?.12:id==='spears'?.15:id==='magic'?.15:id==='charge'?.10:0);
  return {
    hp:Math.round(base.hp*levelScale*gradeScale*(trait.hp||1)*mult('health')),
    attack:base.attack*levelScale*gradeScale*(trait.attack||1)*(soldier.classId==='archer'?mult('arrows'):soldier.classId==='mystic'?mult('magic'):1)*mult('charge'),
    defense:base.defense*(1+(soldier.level-1)*.055)*(1+gradeIndex*.12)*(soldier.classId==='guardian'?mult('shield'):1),
    speed:base.speed*(trait.speed||1)*mult('march'),
    range:base.range*(soldier.classId==='spearman'?mult('spears'):1),
    cooldown:base.cooldown
  };
}
function awardXp(s,xp){if(s.condition==='dead')return false;const old=s.level;s.xp+=xp;while(s.level<10&&s.xp>=s.level*16){s.xp-=s.level*16;s.level++;}if(s.level===10)s.xp=Math.min(s.xp,160);const gained=s.level>old;if(gained)s.hp=Math.min(statsFor(s).hp,s.hp+(s.level-old)*14);return gained;}
const xpToNext=s=>s.level>=10?0:s.level*16;
function canPromote(s){const next=GRADES[GRADES.indexOf(s.grade)+1];return next&&s.level>=GRADE_MIN[next]?next:null;}
function promote(s,legacy){const next=canPromote(s);if(!next||legacy<GRADE_COST[next]||s.condition==='dead')return {ok:false};const maxBefore=statsFor(s).hp;s.grade=next;s.hp=Math.min(statsFor(s).hp,s.hp+statsFor(s).hp-maxBefore);return {ok:true,cost:GRADE_COST[next],next};}
function createEnemy(r,id,type,x,z,groupId){const def=ENEMIES[type];return {id,type,name:def.name,classId:def.classId,team:'enemy',x,z,hp:def.hp,maxHp:def.hp,attack:def.attack,defense:def.defense,range:def.range,cooldown:def.cooldown,speed:def.speed,attackClock:0,flash:0,anim:0,phase:r.next()*6.28,face:0,state:'active',groupId,boss:!!def.boss,kills:0,level:1,grade:def.boss?'legendary':'recruit'};}
function maxRoster(upgrades){return 12+((upgrades?.quarters)||0)*4;}
function resolveDowned(s,r,upgrades){if(s.condition!=='downed')return null;const surviveChance=clamp(.65+(upgrades.infirmary||0)*.04+(s.traitId==='careful'?.10:0),.3,.94);const survived=r.next()<surviveChance;s.condition=survived?'wounded':'dead';s.recoveryRunsRemaining=survived?r.int(1,2):0;s.hp=survived?Math.max(1,Math.floor(statsFor(s).hp*.22)):0;return survived?'wounded':'dead';}
function healSoldier(s){s.condition='healthy';s.recoveryRunsRemaining=0;s.hp=statsFor(s).hp;}
function makeInitialRoster(r){const seq=['guardian','swordsman','archer','spearman','healer','mystic'];return seq.map((classId,i)=>({...generateSoldier(r,`wl-${i+1}`),classId,hp:CLASSES[classId].hp}));}
function gradeText(s){return GRADE_NAME[s.grade]||s.grade;}


// src/game/world.js

const TOTAL_FLOORS=4;
const FLOOR_BIOMES=[
 {name:'Bosque de Arven',subtitle:'O despertar da companhia',ground:['#7d9c68','#819f71','#86a775'],path:'#b7a180',accent:'#e5c783',sky:[.61,.75,.72]},
 {name:'Floresta Esmeralda',subtitle:'Sob as copas ancestrais',ground:['#527b60','#60886a','#719376'],path:'#927d66',accent:'#94e6b8',sky:[.42,.63,.58]},
 {name:'Ermos de Cinza',subtitle:'Além das terras devastadas',ground:['#9b8772','#a9947e','#b3a08a'],path:'#6f6664',accent:'#ffbd75',sky:[.71,.61,.54]},
 {name:'Altos do Crepúsculo',subtitle:'O último juramento',ground:['#6a8390','#7c91a0','#8894a3'],path:'#a4a5a5',accent:'#dad0ff',sky:[.51,.62,.72]}
];
const biomeForFloor=floor=>FLOOR_BIOMES[Math.max(0,Math.min(FLOOR_BIOMES.length-1,(floor||1)-1))];
// Mapa determinístico sem obstáculos sólidos: nenhum ponto essencial pode ficar inacessível.
function makeWorld(seed,floor=1){
  const r=rng(seed),sites=[];let id=0;
  const add=(kind,x,z,name)=>sites.push({id:`site-${++id}`,kind,x:Math.round(x*10)/10,z:Math.round(z*10)/10,name,done:false,started:false,groupId:null});
  add('home',0,0,'Acampamento da companhia');
  const angles=shuffle([-.45,1.65],r);
  angles.forEach((a,i)=>{const radius=27+r.int(-4,5);add('banner',Math.sin(a)*radius,Math.cos(a)*radius,['Posto do Corvo','Bastião Quebrado','Fortim das Brasas'][i]);});
  add('boss',r.int(-5,5),-42,floor===TOTAL_FLOORS?'Citadela do Último Juramento':'Portal do Guardião');
  for(let i=0;i<3;i++){
    const a=(i+.35)*Math.PI*2/5,dist=12+r.int(2,18),p={x:Math.cos(a)*dist,z:Math.sin(a)*dist};
    if(sites.some(s=>distance(p,s)<8))continue;add('patrol',p.x,p.z,`Patrulha ${i+1}`);
  }
  const others=[['recruit','Prisioneiros libertáveis'],['recruit','Mercenários errantes'],['recruit','Refugiados armados'],['rest','Fogueira segura'],['rest','Tenda de curandeiros'],['cache','Baú esquecido'],['cache','Carroça de suprimentos'],['shrine','Santuário antigo'],['shrine','Altar das escolhas']];
  for(const [kind,name] of others){for(let k=0;k<100;k++){const x=r.int(-38,38),z=r.int(-36,36),p={x,z};if(distance(p,{x:0,z:0})<6||sites.some(s=>distance(p,s)<7.5))continue;add(kind,x,z,name);break;}}
  const foliage=[];for(let i=0;i<260;i++){
    const x=r.int(-49,49)+r.next(),z=r.int(-49,49)+r.next();
    if(sites.some(s=>distance({x,z},s)<4.7)||Math.abs(x)<2&&Math.abs(z)<2)continue;
    foliage.push({x,z,type:r.int(0,9)<6?'pine':r.int(0,1)?'rock':'bush',scale:.6+r.next()*.95,seed:r.int(0,99999)});
  }
  const patches=[];for(let i=0;i<180;i++)patches.push({x:r.int(-49,49),z:r.int(-49,49),s:.5+r.next()*2.2,t:r.int(0,2)});
  const details=[];for(let i=0;i<490;i++){const x=r.int(-50,50)+r.next(),z=r.int(-50,50)+r.next();if(sites.some(q=>distance(q,{x,z})<3.5))continue;details.push({x,z,type:r.int(0,14),size:.5+r.next(),seed:r.int(0,9999)});}
  return {seed,floor,biome:biomeForFloor(floor),sites,foliage,patches,details,size:104};
}
const nearestSite=(world,x,z,filter=s=>!s.done)=>world.sites.filter(filter).sort((a,b)=>Math.hypot(a.x-x,a.z-z)-Math.hypot(b.x-x,b.z-z))[0];


// src/game/persistence.js



const SAVE_KEY='warband-legacy-save-v2';
function freshMeta(){const r=rng(31415926),roster=makeInitialRoster(r);return {version:VERSION,created:Date.now(),legacy:3,upgrades:{infirmary:0,quarters:0,academy:0,command:0},roster,selectedIds:roster.slice(0,5).map(s=>s.id),memorial:[],runNumber:0,wins:0,losses:0,commander:'iron',settings:{sound:true,quality:'medium'},activeRun:null,history:[],nextId:100,tutorialShown:false};}
function loadMeta(storage=globalThis.localStorage){try{const raw=storage.getItem(SAVE_KEY);if(!raw)return freshMeta();const data=JSON.parse(raw);if(data?.version!==VERSION||!Array.isArray(data.roster)||!data.upgrades||!Array.isArray(data.selectedIds)||!Array.isArray(data.memorial))throw Error('incompatible');return data;}catch(e){console.warn('Save inválido; início seguro sem sobrescrever até novo save',e);return freshMeta();}}
function saveMeta(meta,storage=globalThis.localStorage){try{storage.setItem(SAVE_KEY,JSON.stringify(meta));return true;}catch(e){console.warn('Não foi possível salvar',e);return false;}}
function clearSave(storage=globalThis.localStorage){storage.removeItem(SAVE_KEY);}


// src/game/simulation.js





const FIXED=1/30;
const alive=u=>u&&u.hp>0&&u.state!=='dead'&&u.condition!=='dead'&&u.condition!=='downed'&&u.condition!=='wounded';
const pick3=(items,r)=>{let a=[...items],result=[];for(let i=0;i<3&&a.length;i++)result.push(a.splice(r.int(0,a.length-1),1)[0]);return result;};
class Game {
 constructor(){this.meta=loadMeta();this.run=this.meta.activeRun||null;this.listeners=new Set();this.input={x:0,z:0};this.frameAccumulator=0;this.saveAccumulator=0;this.lastNote='';this.now=0;this.r=this.run?rng(this.run.rngState):null;this.sfx=null;
  // Migração sem apagar quartel ou veteranos dos saves feitos com a v0.2.
  if(this.run&&!this.run.floor&&!this.run.finished){const run=this.run;run.floor=1;run.maxFloors=TOTAL_FLOORS;run.floorsCleared=0;run.banners=0;run.world=makeWorld(run.seed,1);run.groupStats={};run.enemies=[];run.projectiles=[];run.fx=[];run.pending=null;run.spawnCooldown=3;run.commander.x=0;run.commander.z=0;run.commander.dodge=0;run.commander.invuln=0;run.commander.dashTime=0;run.soldiers.forEach((unit,i)=>{unit.x=(i%5-2)*1.4;unit.z=2+Math.floor(i/5)*1.5;});this.persist();}
  if(this.run&&!this.run.finished){this.run.commander.dodge??=0;this.run.commander.invuln??=0;this.run.commander.dashTime??=0;this.run.commander.combo??=0;this.run.commander.comboWindow??=0;this.run.commander.attackLunge??=0;}}
 onChange(cb){this.listeners.add(cb);return ()=>this.listeners.delete(cb);}
 notify(event='update',data={}){for(const fn of this.listeners)fn(event,data);}
 persist(){if(this.run)this.run.rngState=this.r.state;this.meta.activeRun=this.run;saveMeta(this.meta);}
 msg(text){this.lastNote=text;this.notify('toast',{text});}
 selectSoldier(id){const s=this.meta.roster.find(s=>s.id===id);if(!s)return;const ids=this.meta.selectedIds; if(ids.includes(id)){if(ids.length>1)this.meta.selectedIds=ids.filter(x=>x!==id);}else if(ids.length<5&&s.condition==='healthy')ids.push(id);else{this.msg(s.condition!=='healthy'?'Soldado ferido: trate-o primeiro.':'Máximo de 5 soldados iniciais.');return;}this.persist();this.notify('barracks');}

// Warband Legacy – efeitos originais sintetizados, sem trilhas ou samples licenciados.
// AudioContext só é criado após interação do jogador; nunca toca automaticamente.
class Sound {
 constructor(){this.ctx=null;this.enabled=true;this.last={};}
 getContext(){if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx;}
 play(type='tap'){
  if(!this.enabled)return;
  try{
   const ctx=this.getContext(),now=ctx.currentTime;
   if(now-(this.last[type]??-1)<(type==='hit'?.09:.045))return;
   this.last[type]=now;
   const note=(from,to,duration,vol,shape='sine')=>{
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=shape;
    o.frequency.setValueAtTime(from,now);o.frequency.exponentialRampToValueAtTime(Math.max(25,to),now+duration);
    g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.007);g.gain.exponentialRampToValueAtTime(.0001,now+duration);
    o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+duration+.015);
   };
   const noise=(duration,vol,filterFreq)=>{
    const count=Math.max(100,Math.floor(ctx.sampleRate*duration)),buffer=ctx.createBuffer(1,count,ctx.sampleRate),data=buffer.getChannelData(0);
    for(let i=0;i<count;i++)data[i]=(Math.random()*2-1)*(1-i/count);
    const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();src.buffer=buffer;filter.type='highpass';filter.frequency.value=filterFreq;gain.gain.value=vol;src.connect(filter);filter.connect(gain);gain.connect(ctx.destination);src.start(now);src.stop(now+duration);
   };
   if(type==='slash'){note(290,78,.14,.045,'triangle');noise(.12,.055,700);}
   else if(type==='dash'){note(260,680,.19,.025,'sine');noise(.16,.04,1300);}
   else if(type==='hit'){note(145,62,.10,.042,'triangle');noise(.095,.022,900);}
   else if(type==='victory'){note(420,630,.25,.04,'sine');}
   else if(type==='skill'){note(300,90,.24,.045,'sawtooth');noise(.18,.017,400);}
   else {note(470,330,.055,.014,'sine');}
  }catch(error){/* Áudio opcional: nunca deve interromper o jogo. */}
 }
}

 mainMenu(){const resume=!!this.game.run&&!this.game.run.finished;return `<div class="screen menu-screen"><div class="hero-area"><div class="seal">⚔</div><div class="eyebrow">UM ROGUELITE DE EXÉRCITOS</div><h1>WARBAND<br><span>LEGACY</span></h1><p class="tagline">Every soldier has a story.</p><div class="hero-line"></div><p class="menu-description">Recrute. Lute. Sobreviva.<br>Suas vitórias são lembradas. Suas perdas também.</p><div class="menu-actions">${resume?iconButton('▶ Continuar expedição','continue','','btn btn-primary'):''}${iconButton('⚑ Entrar no quartel','barracks','','btn btn-primary')}${iconButton('⚙ Configurações','settings','','btn btn-muted')}</div><div class="version">VERSÃO JOGÁVEL 0.4.0 · OFFLINE · SEM ANÚNCIOS</div></div><div class="menu-side"><div class="menu-side-badge"><span>✧</span><strong>Seu exército.<br>Seu legado.</strong><small>Comandante • Tropas • Estratégia</small></div></div></div>`;}

 results(){const r=this.game.run,rec=r?.finalResult;if(!rec)return '';const title={victory:'VITÓRIA!',retreat:'RETIRADA SEGURA',defeat:'EXPEDIÇÃO PERDIDA'}[rec.type];const retained=rec.returnables||[];const m=this.game.meta;return `<div class="screen result-screen"><div class="result-box"><div class="eyebrow">RELATÓRIO DA EXPEDIÇÃO Nº ${r.number}</div><div class="victory-symbol">${rec.type==='victory'?'♛':rec.type==='retreat'?'⚑':'⚔'}</div><h2>${title}</h2><p>O destino da companhia foi decidido. Os sobreviventes carregam a história adiante.</p><div class="stats-grid"><div><b>${rec.floors||1}/${TOTAL_FLOORS}</b><small>Andares</small></div><div><b>${rec.kills}</b><small>Inimigos abatidos</small></div><div><b>${fmtTime(rec.elapsed)}</b><small>Duração</small></div><div><b>+${rec.legacy} ◈</b><small>Insígnias</small></div><div><b>${rec.wounded}</b><small>Feridos</small></div><div><b>${rec.dead}</b><small>Mortos</small></div></div><div class="result-recruits"><h3>Novos soldados para o quartel <small>${rec.chosenIds.length}/2 escolhidos · vagas ${m.roster.length}/${maxRoster(m.upgrades)}</small></h3><p>Selecione até dois sobreviventes recrutados durante a expedição. Os demais serão desmobilizados.</p><div class="survivor-list">${retained.length?retained.map(s=>`<button class="survivor ${rec.chosenIds.includes(s.id)?'kept':''}" data-action="keep" data-id="${s.id}" ${rec.chosenIds.includes(s.id)?'disabled':''}><span>${CLASSES[s.classId]?.icon||'⚔'}</span><b>${s.name}</b><small>${CLASSES[s.classId]?.name} · Nv ${s.level} · ${conditions[s.condition]}</small><strong>${rec.chosenIds.includes(s.id)?'✓ Salvo':'+ Guardar'}</strong></button>`).join(''):'<div class="empty-state">Nenhum novo recruta sobreviveu a esta expedição.</div>'}</div></div>${iconButton('⚑ Voltar ao quartel','return','','btn btn-primary btn-wide')}</div></div>`;}

 openPanel(type){this.modal=type;const existing=document.querySelector('.floating-panel');if(existing)existing.remove();const wrapper=document.createElement('div');wrapper.className='floating-panel';let title='',content='';const m=this.game.meta;

  if(type==='settings'||type==='pause'){title=type==='pause'?'Jogo pausado':'Configurações';content=`<div class="info-content"><label class="setting-row">Som <input type="checkbox" id="sound-setting" ${m.settings.sound?'checked':''}></label><label class="setting-row">Qualidade gráfica <select id="quality-setting"><option value="low" ${m.settings.quality==='low'?'selected':''}>Baixa</option><option value="medium" ${m.settings.quality==='medium'?'selected':''}>Média</option><option value="high" ${m.settings.quality==='high'?'selected':''}>Alta</option></select></label><p>Gráficos WebGL2 procedurais e progresso salvo localmente no navegador, sem conexão com servidor.</p>${type==='pause'?'<button class="btn btn-muted btn-wide" data-action="leave">Voltar ao menu (expedição salva)</button>':''}<button class="btn btn-danger btn-wide" data-action="resetConfirm">Apagar todos os dados</button></div>`;}
  if(type==='soldier'){const s=m.roster.find(a=>a.id===this.infoId);if(!s)return;const st=statsFor(s);title=s.name;content=`<div class="soldier-detail"><span class="soldier-detail-icon">${CLASSES[s.classId].icon}</span><p><b>${CLASSES[s.classId].name}</b> · ${GRADE_NAME[s.grade]} · Nível ${s.level} · ${conditions[s.condition]}</p><p>Traço: <b>${({sturdy:'Resistente',swift:'Ágil',precise:'Preciso',careful:'Prudente'})[s.traitId]}</b></p><div class="detail-stats"><span>♥ Vida <b>${Math.ceil(s.hp)}/${st.hp}</b></span><span>⚔ Ataque <b>${Math.round(st.attack)}</b></span><span>⬡ Defesa <b>${Math.round(st.defense)}</b></span><span>↗ Velocidade <b>${st.speed.toFixed(1)}</b></span><span>★ XP <b>${s.xp}/${xpToNext(s)||'MAX'}</b></span><span>♟ Batalhas <b>${s.battles}</b></span><span>⚔ Abates <b>${s.kills}</b></span></div>${canPromote(s)?`<button class="btn btn-primary btn-wide" data-action="promote" data-id="${s.id}">Promover por ◈ ${GRADE_COST[canPromote(s)]}</button>`:''}${s.condition==='wounded'?`<button class="btn btn-muted btn-wide" data-action="recover" data-id="${s.id}">Recuperar por ◈ 2</button>`:''}</div>`;}

  this.root.append(wrapper);const sound=wrapper.querySelector('#sound-setting'),quality=wrapper.querySelector('#quality-setting');if(sound)sound.onchange=e=>{m.settings.sound=e.target.checked;if(this.sound)this.sound.enabled=e.target.checked;this.game.persist();};if(quality)quality.onchange=e=>{m.settings.quality=e.target.value;this.renderer.setQuality(e.target.value);this.game.persist();};}
 attachEvents(){this.root.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;const g=this.game;this.sound?.play('tap');
 switch(action){case 'menu':this.screen='menu';this.draw();break;case 'continue':this.screen='play';this.draw();break;case 'barracks':this.screen='barracks';this.draw();break;case 'commander':g.changeCommander(id);break;case 'select':g.selectSoldier(id);break;case 'upgrade':g.buyUpgrade(id);break;case 'promote':g.upgradeSoldier(id);this.refreshPanel();break;case 'recover':g.recoverSoldier(id);this.refreshPanel();break;case 'start':g.startRun();break;case 'inspect':this.infoId=id;this.openPanel('soldier');break;case 'memorial':case 'help':case 'settings':this.openPanel(action);break;case 'pause':this.openPanel('pause');break;case 'closePanel':this.closePanel();break;case 'return':g.returnBarracks();break;case 'keep':g.keepRecruit(id);break;case 'choose':g.chooseModal(Number(b.dataset.index));break;case 'skip':if(g.run?.pending?.type==='recruit'){const s=g.run.world.sites.find(s=>s.id===g.run.pending.siteId);if(s)s.done=true;g.run.pending=null;g.persist();g.notify('modalClosed');}break;case 'order':g.setOrder(id);this.draw();break;case 'formation':g.changeFormation();this.draw();break;case 'interact':g.useInteract();break;case 'attack':if(g.basicAttack())this.sound?.play('slash');break;case 'dodge':if(g.dodge())this.sound?.play('dash');break;case 'ability1':g.activateAbility(1);this.sound?.play('skill');break;case 'ability2':g.activateAbility(2);this.sound?.play('skill');break;case 'resetConfirm':if(confirm('Apagar TODAS as conquistas, soldados e o memorial?')){this.closePanel();g.reset();}break;case 'leave':g.persist();this.closePanel();this.screen='menu';this.draw();break;default:break;}
 });
 document.addEventListener('keydown',event=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(event.key))event.preventDefault();this.keys.add(event.key.toLowerCase());if(event.repeat)return;if(this.root.querySelector('.info-modal')){if(event.key==='Escape')this.closePanel();return;}if(this.screen!=='play')return;switch(event.key.toLowerCase()){case 'e':this.game.useInteract();break;case ' ':if(this.game.basicAttack())this.sound?.play('slash');break;case 'shift':if(this.game.dodge())this.sound?.play('dash');break;case '1':this.game.activateAbility(1);this.sound?.play('skill');break;case '2':this.game.activateAbility(2);this.sound?.play('skill');break;case 'q':this.game.setOrder(this.game.run.order==='follow'?'defend':'follow');this.draw();break;case 'f':this.game.changeFormation();this.draw();break;case 'escape':this.openPanel('pause');break;}});
 document.addEventListener('keyup',event=>this.keys.delete(event.key.toLowerCase()));window.addEventListener('blur',()=>{this.keys.clear();if(this.game.run&&!this.game.run.finished)this.game.persist();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&this.game.run)this.game.persist();});
 this.root.addEventListener('pointerdown',event=>{const area=event.target.closest('#joystick');if(!area||this.game.run?.pending)return;event.preventDefault();this.joystick.active=true;this.joystick.pointer=event.pointerId;area.setPointerCapture(event.pointerId);this.updateStick(event,area);});
 this.root.addEventListener('pointermove',event=>{if(!this.joystick.active||event.pointerId!==this.joystick.pointer)return;const area=this.root.querySelector('#joystick');if(area)this.updateStick(event,area);});
 const clear=e=>{if(e.pointerId!==this.joystick.pointer)return;this.joystick.active=false;this.joystick.x=0;this.joystick.z=0;const stick=this.root.querySelector('#stick');if(stick)stick.style.transform='translate(-50%,-50%)';};this.root.addEventListener('pointerup',clear);this.root.addEventListener('pointercancel',clear);
 this.renderer.canvas.addEventListener('click',e=>{if(this.screen!=='play'||this.game.run?.pending)return;const selected=this.renderer.screenTarget(e.clientX,e.clientY,this.game.run);if(selected){this.game.run.focusId=selected.id;this.game.setOrder('focus');this.draw();this.showToast(`Alvo prioritário: ${selected.name}`);}});
 }
 updateStick(event,area){const r=area.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=event.clientX-cx,dy=event.clientY-cy,len=Math.hypot(dx,dy),max=42,ratio=Math.min(1,len/max);this.joystick.x=len?dx/len*ratio:0;this.joystick.z=len?dy/len*ratio:0;const stick=this.root.querySelector('#stick');if(stick)stick.style.transform=`translate(calc(-50% + ${this.joystick.x*max}px),calc(-50% + ${this.joystick.z*max}px))`;}
 closePanel(){this.root.querySelector('.floating-panel')?.remove();this.modal='';}
 refreshPanel(){if(this.modal==='soldier')this.openPanel('soldier');}
 isPaused(){return !!this.root.querySelector('.floating-panel')&&this.screen==='play';}
 getInput(){if(this.screen!=='play'||this.isPaused()||this.game.run?.pending)return {x:0,z:0};const keys=this.keys;let x=0,z=0;if(keys.has('a')||keys.has('arrowleft'))x--;if(keys.has('d')||keys.has('arrowright'))x++;if(keys.has('w')||keys.has('arrowup'))z--;if(keys.has('s')||keys.has('arrowdown'))z++;if(this.joystick.active){x=this.joystick.x;z=this.joystick.z;}return {x,z};}
 update(time){if(time-this.lastUI<180)return;this.lastUI=time;if(this.screen!=='play'||!this.game.run)return;const r=this.game.run,c=r.commander;const set=(id,text)=>{const el=this.root.querySelector('#'+id);if(el)el.textContent=text;};set('leader-hp',`${Math.ceil(c.hp)} / ${c.maxHp} PV`);const hp=this.root.querySelector('#leader-hp-fill');if(hp)hp.style.width=`${Math.max(0,c.hp/c.maxHp*100)}%`;
 set('combo-mark',(c.comboWindow||0)>0&&c.combo>1?`×${c.combo}`:'');set('coins',r.coins);set('supplies',r.supplies);set('troopcount',r.soldiers.filter(s=>s.condition==='healthy').length);set('objective',`⚑ Postos ${r.banners}/2 · Andar ${r.floor||1}/${TOTAL_FLOORS}`);set('clock',fmtTime(r.elapsed));set('formation-name',r.formation==='balanced'?'Equilibrada':'Defensiva');
 const site=r.banners>=2?r.world.sites.find(s=>s.kind==='boss'):r.world.sites.filter(s=>!s.done&&s.kind==='banner').sort((a,b)=>distance(c,a)-distance(c,b))[0];if(site){const d=Math.ceil(distance(c,site));set('direction',r.banners>=2?'Portal aberto: encontre e derrote o Guardião!':`${site.name} · ${d}m`);}const near=this.game.nearby;const interact=this.root.querySelector('#interact-btn');if(interact)interact.classList.toggle('ready',!!near);set('interact-label',near?(near.kind==='home'?'RETIRAR':near.kind==='rest'?'DESCANSAR':near.kind==='recruit'?'RECRUTAR':near.kind==='shrine'?'SANTUÁRIO':near.kind==='cache'?'ABRIR':'INTERAGIR'):'INTERAGIR');
 for(const [key,elId] of [['ability1','cd1'],['ability2','cd2'],['attackClock','cd-attack'],['dodge','cd-dodge']]){const el=this.root.querySelector('#'+elId);if(el)el.textContent=c[key]>0?key==='attackClock'?'•':Math.ceil(c[key])+'s':'';}
 this.drawMinimap();}
 drawMinimap(){const cnv=this.root.querySelector('#minimap'),r=this.game.run;if(!cnv||!r)return;const ctx=cnv.getContext('2d'),w=cnv.width,h=cnv.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#1c3f3e';ctx.fillRect(0,0,w,h);const pos=(x,z)=>({x:(x+52)/104*w,y:(z+52)/104*h});
 ctx.strokeStyle='#3d5e55';ctx.lineWidth=.5;for(let n=0;n<=8;n++){ctx.beginPath();ctx.moveTo(n*w/8,0);ctx.lineTo(n*w/8,h);ctx.stroke();ctx.beginPath();ctx.moveTo(0,n*h/8);ctx.lineTo(w,n*h/8);ctx.stroke();}
 for(const s of r.world.sites){if(s.done)continue;const p=pos(s.x,s.z);ctx.fillStyle={banner:'#efc47d',boss:r.banners>=2?'#f17e7f':'#9a6768',recruit:'#7acbb5',shrine:'#bda3ed',cache:'#e2d2a4',rest:'#9ed295',patrol:'#cb8584',home:'#ffffff'}[s.kind];ctx.beginPath();ctx.arc(p.x,p.y,['banner','boss','home'].includes(s.kind)?4.4:2.7,0,6.3);ctx.fill();}

 const p=pos(r.commander.x,r.commander.z);ctx.beginPath();ctx.fillStyle='#ffffff';ctx.arc(p.x,p.y,4.5,0,6.29);ctx.fill();ctx.strokeStyle='#ffffff';ctx.beginPath();ctx.arc(p.x,p.y,8.5,0,6.29);ctx.stroke();}
}

const errorToUser=(err)=>{console.error(err);document.querySelector('#ui').innerHTML=`<div style="position:absolute;inset:0;background:#0c2426;padding:3rem;display:grid;place-items:center;color:#f5e0ba"><div><h1>Não foi possível iniciar Warband Legacy</h1><p>${String(err.message||err)}</p><p>É necessário um navegador atualizado com suporte a WebGL2.</p></div></div>`;};

 // Objetos públicos apenas para inspeção manual em desenvolvimento.
